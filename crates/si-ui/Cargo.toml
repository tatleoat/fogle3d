[package]
name = "si-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Softimage|3D's own user-interface toolkit, bottom layer: the views' windows (grafports) and event handling, between the IRIS GL calls and every dialog, menu and view; typed records over the shared 32-bit memory image (si-mem), every call into IRIS GL and into parts not ported behind a trait"

[dependencies]
si-mem = { path = "../si-mem" }
si-gl = { path = "../si-gl" }
si-x87 = { path = "../si-x87" }
# the original's tables, read at run time from the user's install (unit rta)
si-rt = { path = "../si-rt" }

[features]
# A deliberate fault in each group of ported routines, for re/tools/si-ui/fault_check.sh:
# never enabled in a build that is used.
deliberate-fault = []
