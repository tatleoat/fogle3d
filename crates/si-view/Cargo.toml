[package]
name = "si-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Softimage|3D graph list on the shared memory image (si-mem): the list of scene nodes every view draws from and the render commands walk; records in place at the original's layout, each function taking the image and the original's arguments and making the original's allocation calls"

[dependencies]
si-mem = { path = "../si-mem" }
si-types = { path = "../si-types" }
si-x87 = { path = "../si-x87" }

[[bin]]
name = "view-emucheck"
path = "src/bin/view-emucheck/main.rs"
