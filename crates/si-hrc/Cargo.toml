[package]
name = "si-hrc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Softimage|3D model, material and texture files (.hrc, .mtr, .txt, .t3D): the prototype-and-token format, the program's readers and writers"

[dependencies]
si-rt = { path = "../si-rt" }
si-file = { path = "../si-file" }
si-picture = { path = "../si-picture" }
# The image form (src/image): the readers on the shared memory image.
si-mem = { path = "../si-mem" }
si-types = { path = "../si-types" }
# Only for `hrc-emucheck`: the reader of the emulation harness's vector files.
si-x87 = { path = "../si-x87" }
# The byte-order fixers of `byteswap.c` (custom effects), ported there.
si-app = { path = "../si-app" }
