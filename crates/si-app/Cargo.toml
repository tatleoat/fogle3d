[package]
name = "si-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Softimage|3D start-up, command line, top-level state and main loop: the frame the program hangs on, with every part not ported yet behind a trait"

[dependencies]
si-x87 = { path = "../si-x87" }
# the original's message tables, read at run time from the user's install (unit rtdata1)
si-rt = { path = "../si-rt" }
# the batch renderer's start-up on the shared image (finding 0019, section 12)
si-mem = { path = "../si-mem" }

[[bin]]
name = "soft"
path = "src/bin/soft.rs"

[[bin]]
name = "app-emucheck"
path = "src/bin/app-emucheck/main.rs"

[[bin]]
name = "app-imagecheck"
path = "src/bin/app-imagecheck.rs"

[[bin]]
name = "app-oraclecheck"
path = "src/bin/app-oraclecheck.rs"

[[bin]]
name = "app-histcheck"
path = "src/bin/app-histcheck.rs"

[[bin]]
name = "app-fileio-check"
path = "src/bin/app-fileio-check.rs"

[[bin]]
name = "app-cluster-check"
path = "src/bin/app-cluster-check.rs"
