[package]
name = "si-boolean"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Softimage|3D's boolean operations on the shared memory image: boolean.c (the BSP-tree CSG of polygon objects), finding 0037"

[dependencies]
si-mem = { path = "../si-mem" }
si-x87 = { path = "../si-x87" }
si-checkkit = { path = "../si-checkkit" }

[[bin]]
name = "boolean-checkkit"
path = "src/bin/boolean-checkkit/main.rs"

[[bin]]
name = "split-checkkit"
path = "src/bin/split-checkkit/main.rs"
