[package]
name = "si-dict"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Softimage|3D element, relation, attribute and enum dictionaries on the shared memory image (si-mem): records in place at the original's layout, each function taking the image and the original's arguments and making the original's allocation calls"

[dependencies]
# the original's message texts, read at run time from the user's install (release model)
si-rt = { path = "../si-rt" }
si-mem = { path = "../si-mem" }
si-types = { path = "../si-types" }
si-x87 = { path = "../si-x87" }
# the generic check driver (toolbelt T2, finding 0011), for `dict-checkkit`
si-checkkit = { path = "../si-checkkit" }
# Only for `dict-emucheck`'s comparison of an earlier port with the same vectors
# (feature `earlier`, DICT_EARLIER=motion): the animation crate's 19 dictionary functions.
si-motion = { path = "../si-motion", optional = true }

[features]
earlier = ["dep:si-motion"]

[[bin]]
name = "dict-emucheck"
path = "src/bin/dict-emucheck/main.rs"

[[bin]]
name = "dict-checkkit"
path = "src/bin/dict-checkkit/main.rs"
